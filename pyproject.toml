[project]
name = "primitive-db"
version = "0.1.0"
description = "Простой интерфейс командной строки для примитивной базы данных с метаданными в JSON"
readme = "README.md"
authors = [
    { name = "Dan Boltachev", email = "dan.s.boltachev@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "prompt>=0.4.1",
]

[project.scripts]
project = "primitive_db.main:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "C901"]
ignore = []

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]